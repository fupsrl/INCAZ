<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- INCAZ app icon: pixel llama measuring a sine, zero-cost badge. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="1" stop-color="#0c3a3a"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="40" fill="url(#bg)"/>
  <rect x="4" y="4" width="248" height="248" rx="40" fill="none"
        stroke="#3ddc97" stroke-opacity="0.25" stroke-width="4"/>

  <!-- oscilloscope trace the llama stands on -->
  <path d="M 12 208 Q 28 176 44 208 T 76 208 T 108 208 T 140 208 T 172 208 T 204 208 T 236 208"
        fill="none" stroke="#3ddc97" stroke-width="7" stroke-linecap="round"/>

  <!-- pixel llama (16px cells, offset 32,16), facing left -->
  <g fill="#f4f1e8">
    <!-- ears -->
    <rect x="64" y="16" width="16" height="16"/>
    <rect x="96" y="16" width="16" height="16"/>
    <!-- head -->
    <rect x="64" y="32" width="48" height="16"/>
    <!-- snout + head row -->
    <rect x="32" y="48" width="80" height="16"/>
    <!-- neck -->
    <rect x="80" y="64" width="32" height="64"/>
    <!-- body -->
    <rect x="80" y="128" width="128" height="48"/>
    <!-- tail -->
    <rect x="208" y="112" width="16" height="32"/>
    <!-- front legs -->
    <rect x="80" y="176" width="32" height="32"/>
    <!-- hind legs -->
    <rect x="176" y="176" width="32" height="32"/>
  </g>
  <!-- eye -->
  <rect x="46" y="52" width="9" height="9" fill="#16233f"/>

  <!-- zero-cost badge with a drawn Z (QtSvg-safe, no text element) -->
  <rect x="182" y="22" width="52" height="52" rx="10" fill="#e63946"
        transform="rotate(45 208 48)"/>
  <polyline points="194,36 222,36 194,60 222,60" fill="none" stroke="#ffffff"
            stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
